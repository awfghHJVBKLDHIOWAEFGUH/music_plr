# Build release binaries for every desktop target and publish them as a
# GitHub release. Primary trigger: pushing a `v*` tag. Manual and reusable
# runs must also target a tag ref, e.g.
#   gh workflow run release.yml --ref v1.7.0-tiny-skia.1
#
# Platforms (one job each):
#   - icons         – generates .ico + .icns once (cached on app-icon.svg hash), uploads as artifact
#   - build-linux   – Ubuntu, x86_64
#   - build-macos   – macOS, aarch64 + x86_64 (matrix, same runner type)
#   - build-windows – Windows, x86_64 MSVC
#   - release       – collects artifacts, publishes GitHub release
#   - publish-crates-io – publishes to crates.io (independent; never blocks release)
#
# To add Linux ARM, create a new `build-linux-arm` job using `cross`
# (https://github.com/cross-rs/cross) on ubuntu-latest.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark this release as a pre-release"
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        default: false

# A release must never race another run over the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default read-only; the GitHub-release job widens this to `write`.
permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve and validate tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *)
              echo "::error::Release workflow must run on a v* tag ref, got '$tag'"
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            echo "::error::Tag '$tag' does not exist as a Git tag"
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag -> $sha"

      - name: Verify tag matches this run commit
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$TAG_SHA" ]; then
            echo "::error::github.sha $GITHUB_SHA does not match tag commit $TAG_SHA"
            exit 1
          fi

  icons:
    name: Generate icons
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Restore cached icons
        id: icon-cache
        uses: actions/cache@v4
        with:
          path: |
            windows/app.ico
            macos/goosemusic.icns
          key: icons-${{ hashFiles('icons/app-icon.svg', 'scripts/generate-icons.sh') }}

      - name: Install icon generation dependencies
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y imagemagick icnsutils

      - name: Generate icons
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: bash scripts/generate-icons.sh

      - name: Upload icons
        uses: actions/upload-artifact@v7
        with:
          name: icons
          path: |
            windows/app.ico
            macos/goosemusic.icns
          if-no-files-found: error

  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build
        env:
          GOOSE_RELEASE_TAG: ${{ needs.tag.outputs.value }}
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          tar -czf goosemusic-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release goosemusic \
            -C "$GITHUB_WORKSPACE" goosemusic.desktop icons/app-icon.svg
          # Checksum sidecar verified by the self-updater:
          # `{asset}.sha256` next to `{asset}` on the release.
          sha256sum goosemusic-x86_64-unknown-linux-gnu.tar.gz > goosemusic-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-unknown-linux-gnu
          path: |
            goosemusic-x86_64-unknown-linux-gnu.tar.gz
            goosemusic-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: [icons, tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: .

      - name: Build
        env:
          GOOSE_RELEASE_TAG: ${{ needs.tag.outputs.value }}
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/goosemusic.exe `
            -DestinationPath goosemusic-x86_64-pc-windows-msvc.zip
          # Checksum sidecar verified by the self-updater:
          # `{asset}.sha256` next to `{asset}` on the release.
          $hash = (Get-FileHash goosemusic-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  goosemusic-x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii -NoNewline goosemusic-x86_64-pc-windows-msvc.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-pc-windows-msvc
          path: |
            goosemusic-x86_64-pc-windows-msvc.zip
            goosemusic-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [tag, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: goosemusic-*
          merge-multiple: true
          path: dist

      - name: Build release body from CHANGELOG.md
        env:
          TAG: ${{ needs.tag.outputs.value }}
        run: |
          python3 - <<'EOF'
          import os
          import pathlib
          import re
          import textwrap

          tag = os.environ.get("TAG", "")
          version = tag[1:] if tag.startswith("v") else tag
          changelog = ""
          path = pathlib.Path("CHANGELOG.md")
          if path.exists():
              text = path.read_text()
              m = re.search(
                  rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^##\s|\Z)",
                  text,
                  re.M | re.S,
              )
              if m:
                  changelog = m.group(1).strip()
                  changelog = re.sub(
                      r"(?m)^\[.+?\]:\s*https?://.*$", "", changelog
                  ).strip()

          if not changelog:
              changelog = "_See the auto-generated notes below._"

          footer = textwrap.dedent(f"""\
          ## Quick install

          ```sh
          curl -fsSL "https://raw.githubusercontent.com/awfghHJVBKLDHIOWAEFGUH/music_plr/{tag}/scripts/install.sh" | bash
          ```

          Detects your platform and installs everything. See the [README](https://github.com/awfghHJVBKLDHIOWAEFGUH/music_plr/tree/{tag}#installation) for manual install options.

          ## Runtime prerequisites

          `goosemusic` is a self-contained binary. On first launch it checks
          for its external tools and can **download `yt-dlp` for you** — a
          standalone binary. Just accept the prompt.

          - **`yt-dlp`** — YouTube audio streaming & downloads (auto-downloaded if missing)
          - **D-Bus** session bus (Linux) — MPRIS media-key integration (OS-provided)

          Nothing needs installing manually to play, stream, or download.
          """)
          body = f"## What's changed\n\n{changelog}\n\n{footer}"
          pathlib.Path("BODY.md").write_text(body)
          print(f"Tag {tag}: changelog chars={len(changelog)}")
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.value }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          body_path: BODY.md

# THIS IS WITHOUT MACOS BECAUSE IT WAS CAUSING PROBLEMS DURING DEVELOPMENT
