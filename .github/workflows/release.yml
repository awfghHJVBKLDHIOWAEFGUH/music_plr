# Build GooseMusic TinySkia release binaries for every supported desktop target.
#
# A manual dispatch runs the build/package jobs only (validation).
# Pushing a v*-tiny-skia.* tag builds and publishes a GitHub Release.
#
# Platforms (one job each):
#   - icons         – generates .ico + .icns once (cached on app-icon.svg hash), uploads as artifact
#   - build-linux   – Ubuntu, x86_64
#   - build-macos   – macOS, aarch64 + x86_64 (matrix, same runner type)
#   - build-windows – Windows, x86_64 MSVC
#   - release       – collects artifacts and publishes the tagged fork release
#
# To add Linux ARM, create a new `build-linux-arm` job using `cross`
# (https://github.com/cross-rs/cross) on ubuntu-latest.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-tiny-skia.*"

# Default read-only; the GitHub-release job widens this to `write`.
permissions:
  contents: read

jobs:
  icons:
    name: Generate icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached icons
        id: icon-cache
        uses: actions/cache@v4
        with:
          path: |
            windows/app.ico
            macos/goosemusic.icns
          key: icons-${{ hashFiles('icons/app-icon.svg', 'scripts/generate-icons.sh') }}

      - name: Install icon generation dependencies
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y imagemagick icnsutils

      - name: Generate icons
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: bash scripts/generate-icons.sh

      - name: Upload icons
        uses: actions/upload-artifact@v7
        with:
          name: icons
          path: |
            windows/app.ico
            macos/goosemusic.icns
          if-no-files-found: error

  build-linux:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          tar -czf goosemusic-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release goosemusic \
            -C "$GITHUB_WORKSPACE" goosemusic.desktop icons/app-icon.svg
          # Checksum sidecar verified by the self-updater:
          # `{asset}.sha256` next to `{asset}` on the release.
          sha256sum goosemusic-x86_64-unknown-linux-gnu.tar.gz > goosemusic-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-unknown-linux-gnu
          path: |
            goosemusic-x86_64-unknown-linux-gnu.tar.gz
            goosemusic-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  build-macos:
    name: Build (${{ matrix.target }})
    needs: icons
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: .

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build .app bundle
        run: |
          chmod +x macos/build-app.sh
          macos/build-app.sh \
            target/${{ matrix.target }}/release/goosemusic \
            macos/goosemusic.icns \
            dist

      - name: Package
        run: |
          tar -czf goosemusic-${{ matrix.target }}.tar.gz \
            -C dist Goosemusic.app
          echo "ARCHIVE=goosemusic-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
          # Checksum sidecar verified by the self-updater:
          # `{asset}.sha256` next to `{asset}` on the release.
          sha256sum "goosemusic-${{ matrix.target }}.tar.gz" > "goosemusic-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: icons
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: .

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/goosemusic.exe `
            -DestinationPath goosemusic-x86_64-pc-windows-msvc.zip
          # Checksum sidecar verified by the self-updater:
          # `{asset}.sha256` next to `{asset}` on the release.
          $hash = (Get-FileHash goosemusic-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  goosemusic-x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii -NoNewline goosemusic-x86_64-pc-windows-msvc.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: goosemusic-x86_64-pc-windows-msvc
          path: |
            goosemusic-x86_64-pc-windows-msvc.zip
            goosemusic-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: goosemusic-*
          merge-multiple: true
          path: dist

      - name: Build release body from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          import pathlib
          import re
          import textwrap

          tag = os.environ.get("TAG", "")
          version = tag[1:] if tag.startswith("v") else tag
          changelog = ""
          path = pathlib.Path("CHANGELOG.md")
          if path.exists():
              text = path.read_text()
              m = re.search(
                  rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^##\s|\Z)",
                  text,
                  re.M | re.S,
              )
              if m:
                  changelog = m.group(1).strip()
                  changelog = re.sub(
                      r"(?m)^\[.+?\]:\s*https?://.*$", "", changelog
                  ).strip()

          if not changelog:
              changelog = "_See the auto-generated notes below._"

          footer = textwrap.dedent("""\
          ## Downloads and installation

          These binaries are built from the TinySkia fork, not the upstream GooseMusic releases.

          - **Linux x86_64:** extract the `.tar.gz` archive and run `goosemusic`. The archive also includes the desktop entry and SVG icon.
          - **Windows x86_64:** extract the `.zip` archive and run `goosemusic.exe`.
          - **macOS Apple Silicon:** extract the `aarch64-apple-darwin` archive and move `Goosemusic.app` into Applications.
          - **macOS Intel:** extract the `x86_64-apple-darwin` archive and move `Goosemusic.app` into Applications.

          SHA256 checksum files are provided alongside each archive.

          ## Runtime prerequisites

          `goosemusic` is a self-contained binary. On first launch it checks
          for its external tools and can **download `yt-dlp` for you** — a
          standalone binary needing no Python — just accept the prompt. Only
          optional extras remain:

          - **`yt-dlp`** — YouTube audio streaming & downloads (auto-downloaded if missing)
          - **Python 3** + `ytmusicapi` — nicer YouTube Music search; without it the app
            falls back to `yt-dlp` (these are *not* auto-installed)
          - **D-Bus** session bus (Linux) — MPRIS media-key integration (OS-provided)

          Nothing needs installing manually to play, stream, or download.
          """)
          body = f"## What's changed\n\n{changelog}\n\n{footer}"
          pathlib.Path("BODY.md").write_text(body)
          print(f"Tag {tag}: changelog chars={len(changelog)}")
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: false
          body_path: BODY.md
